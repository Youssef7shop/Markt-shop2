<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | Boostify AI</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>نسيت كلمة المرور؟</h2>
                <p>أدخل بريدك الإلكتروني لإرسال رابط إعادة التعيين</p>
            </div>
            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="example@mail.com">
                </div>
                <button type="submit" class="btn btn-primary btn-block">إرسال رابط الاستعادة</button>
            </form>
            <div class="auth-footer">
                <p><a href="login.html">العودة لتسجيل الدخول</a></p>
            </div>
            <div id="statusMessage" style="margin-top: 15px; text-align: center;"></div>
        </div>
    </div>
    <script src="js/supabase.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
