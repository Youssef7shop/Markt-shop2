<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعيين كلمة مرور جديدة | Boostify AI</title>
    <link rel="stylesheet" href="login.css"> <!-- نستخدم نفس تنسيق صفحة الدخول -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>كلمة مرور جديدة</h2>
                <p>يرجى إدخال كلمة المرور الجديدة لحسابك</p>
            </div>
            <form id="updatePasswordForm" class="auth-form">
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">تحديث كلمة المرور</button>
            </form>
        </div>
    </div>
    
    <script src="js/supabase.js"></script>
    <script>
        // المنطق البرمجي الخاص بتحديث كلمة المرور
        document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            
            const { error } = await window.supabaseClient.auth.updateUser({
                password: newPassword
            });
            
            if (error) {
                alert('حدث خطأ: ' + error.message);
            } else {
                alert('تم تغيير كلمة المرور بنجاح. سيتم توجيهك لصفحة الدخول.');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
