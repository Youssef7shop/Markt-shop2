<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | Boostify AI</title>
    <link rel="stylesheet" href="register.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>حساب جديد</h2>
                <p>انضم إلى Boostify AI اليوم</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="phone" placeholder="+212...">
                    </div>
                    <div class="form-group">
                        <label>الدولة</label>
                        <input type="text" id="country" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required>
                        <button type="button" class="toggle-pwd">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div class="form-group role-selection">
                    <label>نوع الحساب:</label>
                    <label><input type="radio" name="role" value="client" checked> عميل</label>
                    <label><input type="radio" name="role" value="provider"> مقدّم خدمة</label>
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="terms" required>
                        أوافق على <a href="terms.html">الشروط والأحكام</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">إنشاء حساب</button>
                <div id="errorMessage" class="error-msg"></div>
            </form>
            <div class="auth-footer">
                <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>
    <script src="js/supabase.js"></script>
    <script src="register.js"></script>
</body>
</html>
