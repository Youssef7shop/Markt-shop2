<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف مقدّم الخدمة | Boostify AI</title>
    <link rel="stylesheet" href="dashboard.css"> <!-- نعتمد على نفس التنسيق الأساسي -->
    <link rel="stylesheet" href="provider.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="dashboard-layout">
        <!-- الشريط الجانبي للمزود -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Boostify AI - Provider</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="provider-profile.html" class="active">الملف الشخصي</a>
                <a href="provider-services.html">إدارة الخدمات</a>
                <a href="provider-orders.html">الطلبات الواردة</a>
                <a href="wallet.html">المحفظة</a>
                <a href="transactions.html">سجل العمليات</a>
                <a href="messages.html">الرسائل</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn btn-outline btn-block">تسجيل الخروج</button>
            </div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <header class="topbar">
                <h2 id="welcomeMsg">إدارة ملف مقدّم الخدمة</h2>
                <div class="user-menu">
                    <span id="verificationBadge" class="badge">غير موثق</span>
                    <span id="ratingBadge" class="badge bg-gold">⭐ 0.0</span>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="form-container">
                    <h3>المعلومات المهنية</h3>
                    <form id="providerProfileForm">
                        <div class="form-group">
                            <label>النبذة التعريفية (Bio)</label>
                            <textarea id="bio" rows="4" placeholder="تحدث عن خبراتك وما تقدمه..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>المهارات (افصل بينها بفاصلة)</label>
                            <input type="text" id="skills" placeholder="مثال: تصميم، برمجة، كتابة">
                        </div>
                        <button type="submit" class="btn btn-primary" id="saveBtn">حفظ التعديلات</button>
                        <div id="statusMsg" style="margin-top: 15px;"></div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="provider-profile.js"></script>
</body>
</html>
