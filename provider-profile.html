<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Boostify AI</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="profile.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h3>Boostify AI</h3></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">لوحة التحكم</a>
                <a href="profile.html" class="active">الملف الشخصي</a>
                <a href="messages.html">الرسائل</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar"><h2>إعدادات الملف الشخصي</h2></header>
            
            <div class="content-wrapper">
                <div class="profile-container">
                    <form id="profileForm" class="auth-form">
                        <div class="avatar-section">
                            <div class="avatar-placeholder"></div>
                            <button type="button" class="btn btn-outline">تغيير الصورة</button>
                        </div>
                        <div class="form-group">
                            <label>الاسم الكامل</label>
                            <input type="text" id="fullName" required>
                        </div>
                        <div class="form-group">
                            <label>البريد الإلكتروني</label>
                            <input type="email" id="email" disabled>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="tel" id="phone">
                        </div>
                        <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/supabase.js"></script>
    <script src="profile.js"></script>
</body>
</html>
